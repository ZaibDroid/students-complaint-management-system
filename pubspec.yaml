name: student_complaint_managment_system
description: "Department Complaint Management System (DCMS) - UET Mardan"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1

  # Networking (for Laravel Backend API integration)
  http: ^1.2.1
  dio: ^5.4.3+1

  # Firebase Core & FCM (Cloud Messaging for push notifications)
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.2

  # UI, Fonts & Styling
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Utilities & Media
  image_picker: ^1.1.2
  uuid: ^4.4.0
  equatable: ^2.0.5
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
